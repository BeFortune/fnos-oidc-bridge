# fnos-oidc-bridge: 把 /oidc 前缀路由到本机桥接服务(127.0.0.1:4223)。
# 该文件会被 include 进 fnOS 主 nginx 的 server{} 块(5666/5667)。
# proxy_pass 不带 URI,保留 /oidc 前缀,由桥接服务自己剥离。
# 服务端到服务端的 OIDC 端点不能经过访问码等 auth_request 拦截。
location /oidc/ {
    auth_request off;
    proxy_pass http://127.0.0.1:4223;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}

location = /oidc {
    auth_request off;
    return 308 /oidc/;
}
